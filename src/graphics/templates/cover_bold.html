<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
      position: relative;
    }
    .bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.8) 100%);
      z-index: 2;
    }
    .container {
      position: relative;
      z-index: 3;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 120px 60px;
      text-align: center;
    }
    .logo {
      width: 360px;
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0px 4px 12px rgba(0,0,0,0.8));
    }
    .title {
      font-size: 80px;
      font-weight: 900;
      color: #FFFFFF;
      line-height: 1.1;
      text-transform: uppercase;
      letter-spacing: -1px;
      text-shadow: 0 10px 30px rgba(0,0,0,0.9);
      margin: auto 0;
    }
  </style>
</head>
<body>
  <img class="bg" src="{{ background_path }}" alt="bg">
  <div class="overlay"></div>
  <div class="container">
    <img class="logo" src="{{ logo_path }}" alt="logo">
    <h1 class="title">{{ title }}</h1>
  </div>
</body>
</html>
