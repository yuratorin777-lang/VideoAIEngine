<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
      position: relative;
    }
    .bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }
    .container {
      position: relative;
      z-index: 2;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 100px 70px;
      background: rgba(0,0,0,0.25);
    }
    .logo {
      width: 300px;
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0px 4px 8px rgba(0,0,0,0.8));
    }
    .title-badge {
      background: #111111;
      color: #FFFFFF;
      display: inline-block;
      padding: 30px 40px;
      border-radius: 20px;
      font-size: 64px;
      font-weight: 900;
      line-height: 1.2;
      box-shadow: 0 15px 35px rgba(0,0,0,0.6);
      border-left: 10px solid #FF0055; /* Фирменный яркий акцент */
    }
  </style>
</head>
<body>
  <img class="bg" src="{{ background_path }}" alt="bg">
  <div class="container">
    <div>
      <img class="logo" src="{{ logo_path }}" alt="logo">
    </div>
    <div>
      <div class="title-badge">{{ title }}</div>
    </div>
  </div>
</body>
</html>
