<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
      position: relative;
    }
    .bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }
    .container {
      position: relative;
      z-index: 2;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 100px 80px;
      background: rgba(0,0,0,0.35);
    }
    .header { display: flex; align-items: center; justify-content: space-between; }
    .logo { 
      max-height: 200px; 
      max-width: 400px;
      width: auto; 
      height: auto;
      object-fit: contain; 
    }
    .card {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
      border-radius: 32px;
      padding: 60px;
      color: #111111;
      margin-top: auto;
    }
    .card-title { font-size: 56px; font-weight: 900; margin-bottom: 24px; color: #000; }
    .card-body { font-size: 36px; line-height: 1.4; color: #333; }
  </style>
</head>
<body>
  <img class="bg" src="{{ background_path }}" alt="bg">
  <div class="container">
    <div class="header">
      <img class="logo" src="{{ logo_path }}" alt="logo">
    </div>
    <div class="card">
      <h2 class="card-title">{{ title }}</h2>
      <p class="card-body">{{ body_text }}</p>
    </div>
  </div>
</body>
</html>
