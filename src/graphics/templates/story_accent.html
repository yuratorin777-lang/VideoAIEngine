<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
      position: relative;
    }
    .bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }
    .container {
      position: relative;
      z-index: 2;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 100px 80px;
      background: linear-gradient(180deg, rgba(0,0,0,0.5) 0%, rgba(0,0,0,0.2) 50%, rgba(0,0,0,0.6) 100%);
    }
    .header {
      display: flex;
      justify-content: flex-start;
      width: 100%;
    }
    .logo {
      width: 320px;
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0px 4px 10px rgba(0,0,0,0.6));
    }
    .card {
      background: rgba(18, 18, 24, 0.88);
      backdrop-filter: blur(16px);
      border: 2px solid rgba(255, 255, 255, 0.15);
      border-radius: 36px;
      padding: 64px;
      color: #FFFFFF;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }
    .card-title {
      font-size: 58px;
      font-weight: 900;
      margin-bottom: 24px;
      color: #FFFFFF;
      line-height: 1.2;
    }
    .card-body {
      font-size: 36px;
      line-height: 1.45;
      color: #E2E8F0;
    }
  </style>
</head>
<body>
  <img class="bg" src="{{ background_path }}" alt="bg">
  <div class="container">
    <div class="header">
      <img class="logo" src="{{ logo_path }}" alt="logo">
    </div>
    <div class="card">
      <h2 class="card-title">{{ title }}</h2>
      <p class="card-body">{{ body_text }}</p>
    </div>
  </div>
</body>
</html>
