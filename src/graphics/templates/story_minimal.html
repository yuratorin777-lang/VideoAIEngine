<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
      position: relative;
    }
    .bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.75) 100%);
      z-index: 2;
    }
    .container {
      position: relative;
      z-index: 3;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 120px 80px;
      text-align: center;
    }
    .logo {
      width: 340px;
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0px 4px 12px rgba(0,0,0,0.6));
    }
    .content-center {
      margin: auto 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
    }
    .title {
      font-size: 68px;
      font-weight: 900;
      color: #FFFFFF;
      line-height: 1.25;
      text-transform: uppercase;
      letter-spacing: 1px;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
    }
    .body-text {
      font-size: 38px;
      font-weight: 500;
      color: #F0F0F0;
      line-height: 1.4;
      max-width: 850px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
    }
  </style>
</head>
<body>
  <img class="bg" src="{{ background_path }}" alt="bg">
  <div class="overlay"></div>
  <div class="container">
    <img class="logo" src="{{ logo_path }}" alt="logo">
    <div class="content-center">
      <h1 class="title">{{ title }}</h1>
      <p class="body-text">{{ body_text }}</p>
    </div>
  </div>
</body>
</html>
