<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
      position: relative;
    }
    .bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }
    /* Градиент слева направо для читаемости текста на широком экране */
    .overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.4) 55%, rgba(0,0,0,0) 100%);
      z-index: 2;
    }
    .container {
      position: relative;
      z-index: 3;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 80px 100px;
      max-width: 1200px;
    }
    .logo {
      width: 320px;
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0px 4px 10px rgba(0,0,0,0.7));
    }
    .title {
      font-size: 76px;
      font-weight: 900;
      color: #FFFFFF;
      line-height: 1.15;
      text-transform: uppercase;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.9);
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <img class="bg" src="{{ background_path }}" alt="bg">
  <div class="overlay"></div>
  <div class="container">
    <img class="logo" src="{{ logo_path }}" alt="logo">
    <h1 class="title">{{ title }}</h1>
  </div>
</body>
</html>
