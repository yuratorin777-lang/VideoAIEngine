name: Generate Story PNG

on:
  workflow_dispatch:
    inputs:
      story_title:
        description: 'Заголовок для Сторис'
        required: true
        default: 'Открыт набор в новые группы!'
      story_body:
        description: 'Основной текст / Описание (оставьте пустым для автогенерации через Gemini)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  render-story:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Чтение кода из Git
        uses: actions/checkout@v4

      - name: 2. Установка Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Установка зависимостей Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -r requirements.txt

      - name: 4. Установка Playwright и Chromium
        run: |
          python -m playwright install chromium --with-deps

      - name: 5. Генерация PNG-сторис (рандом шаблонов + Vercel Proxy)
        env:
          VERCEL_GEMINI_URL: ${{ secrets.VERCEL_GEMINI_URL }}
        run: |
          python -c "
          import os
          import random
          import requests
          from pathlib import Path
          from src.graphics.overlay_generator import OverlayGenerator

          generator = OverlayGenerator()
          brand_dir = Path('04_LIBRARY/brands/dance_kids')

          # 1. Выбор случайного шаблона из 3 доступных
          templates = ['story.html', 'story_minimal.html', 'story_accent.html']
          selected_template = random.choice(templates)

          # 2. Случайный фон
          bg_dir = brand_dir / 'backgrounds'
          bg_files = (
              list(bg_dir.glob('*.png'))
              + list(bg_dir.glob('*.jpg'))
              + list(bg_dir.glob('*.jpeg'))
          ) if bg_dir.exists() else []
          bg_path = random.choice(bg_files).resolve().as_uri() if bg_files else ''

          # 3. Случайный логотип
          logo_files = [
              f for f in brand_dir.glob('logo*.*') 
              if f.suffix.lower() in ['.png', '.jpg', '.jpeg', '.svg']
          ]
          logo_path = random.choice(logo_files).resolve().as_uri() if logo_files else ''

          # 4. Генерация подзаголовка через Vercel Proxy
          user_title = '''${{ inputs.story_title }}'''.strip()
          raw_body = '''${{ inputs.story_body }}'''.strip()

          user_body = ''
          if not raw_body:
              proxy_url = os.environ.get('VERCEL_GEMINI_URL') or 'https://video-ai-engine.vercel.app/api/gemini'
              prompt_text = f'Напиши 1 короткое, вовлекающее предложение-призыв (до 8 слов) для сторис в соцсетях на тему: \"{user_title}\". Без кавычек.'
              
              try:
                  res = requests.post(
                      proxy_url,
                      json={'prompt': prompt_text},
                      timeout=15
                  )
                  if res.status_code == 200:
                      user_body = res.json().get('text', '').strip()
                  else:
                      print(f'Vercel Proxy Status Error: {res.status_code}')
              except Exception as e:
                  print(f'Vercel Proxy Exception: {e}')
          else:
              user_body = raw_body

          # === ВОТ СЮДА ДОБАВЛЯЕМ ПРИНТЫ ДЛЯ ОТЛАДКИ ===
          print(f'Использован шаблон: {selected_template}')
          print(f'Заголовок: {user_title}')
          print(f'Подзаголовок (Gemini): {user_body}')

          # 5. Отрисовка
          context = {
              'background_path': bg_path,
              'logo_path': logo_path,
              'title': user_title,
              'body_text': user_body
          }

          generator.generate_image(
              template_name=selected_template,
              context=context,
              output_path='07_OUTPUT/generated_story.png'
          )
          "

      - name: 6. Выгрузка готовой Сторис в Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-story-png
          path: 07_OUTPUT/generated_story.png
          retention-days: 7