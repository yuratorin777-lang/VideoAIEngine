name: Generate Story PNG

on:
  workflow_dispatch:
    inputs:
      story_title:
        description: 'Заголовок для Сторис'
        required: true
        default: 'Открыт набор в новые группы!'
      story_body:
        description: 'Основной текст / Описание'
        required: false
        default: 'Занятия по вторникам и четвергам. Первое занятие бесплатно!'

permissions:
  contents: read

jobs:
  render-story:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Чтение кода из Git
        uses: actions/checkout@v4

      - name: 2. Установка Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Установка зависимостей Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -r requirements.txt

      - name: 4. Установка Playwright и Chromium
        run: |
          python -m playwright install chromium --with-deps

      - name: 5. Генерация PNG-сторис
        run: |
          python -c "
          import random
          from pathlib import Path
          from src.graphics.overlay_generator import OverlayGenerator

          generator = OverlayGenerator()

          bg_dir = Path('04_LIBRARY/brands/dance_kids/backgrounds')
          bg_files = (
              list(bg_dir.glob('*.png'))
              + list(bg_dir.glob('*.jpg'))
              + list(bg_dir.glob('*.jpeg'))
          )
          
          bg_path = random.choice(bg_files) if bg_files else ''

          context = {
              'background_path': bg_path,
              'logo_path': '04_LIBRARY/brands/dance_kids/logo.png',
              'title': '${{ inputs.story_title }}',
              'body_text': '${{ inputs.story_body }}'
          }

          generator.generate_image(
              template_name='story.html',
              context=context,
              output_path='07_OUTPUT/generated_story.png'
          )
          "

      - name: 6. Выгрузка готовой Сторис в Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-story-png
          path: 07_OUTPUT/generated_story.png
          retention-days: 7