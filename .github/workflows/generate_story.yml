name: Generate Story PNG

on:
  workflow_dispatch:
    inputs:
      story_title:
        description: 'Заголовок для Сторис'
        required: true
        default: 'Открыт набор в новые группы!'
      story_body:
        description: 'Основной текст / Описание (оставьте пустым для автогенерации через Gemini)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  render-story:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Чтение кода из Git
        uses: actions/checkout@v4

      - name: 2. Установка Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Установка зависимостей Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -r requirements.txt

      - name: 4. Установка Playwright и Chromium
        run: |
          python -m playwright install chromium --with-deps

      - name: 5. Генерация PNG-сторис (с автоподбором логотипа и Gemini)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -c "
          import os
          import random
          from pathlib import Path
          from src.graphics.overlay_generator import OverlayGenerator

          generator = OverlayGenerator()
          brand_dir = Path('04_LIBRARY/brands/dance_kids')

          # 1. Случайный фон
          bg_dir = brand_dir / 'backgrounds'
          bg_files = (
              list(bg_dir.glob('*.png'))
              + list(bg_dir.glob('*.jpg'))
              + list(bg_dir.glob('*.jpeg'))
          ) if bg_dir.exists() else []
          bg_path = random.choice(bg_files).resolve().as_uri() if bg_files else ''

          # 2. Динамический поиск любого логотипа (logo1, logo2, logo_white и т.д.)
          logo_files = [
              f for f in brand_dir.glob('logo*.*') 
              if f.suffix.lower() in ['.png', '.jpg', '.jpeg', '.svg']
          ]
          logo_path = random.choice(logo_files).resolve().as_uri() if logo_files else ''

          # 3. Генерация подзаголовка через Gemini (если поле в inputs пустое)
          user_title = '''${{ inputs.story_title }}'''
          user_body = '''${{ inputs.story_body }}'''.strip()

          if not user_body:
              try:
                  import google.generativeai as genai
                  api_key = os.environ.get('GEMINI_API_KEY')
                  if api_key:
                      genai.configure(api_key=api_key)
                      model = genai.GenerativeModel('gemini-2.5-flash')
                      prompt = f'Напиши 1 короткое, привлекательное предложение-призыв (до 8-10 слов) для сторис в соцсетях на тему: \"{user_title}\". Без кавычек и лишних символов.'
                      response = model.generate_content(prompt)
                      user_body = response.text.strip()
              except Exception as e:
                  print(f'Gemini fallback note: {e}')

          # 4. Рендер картинки
          context = {
              'background_path': bg_path,
              'logo_path': logo_path,
              'title': user_title,
              'body_text': user_body
          }

          generator.generate_image(
              template_name='story.html',
              context=context,
              output_path='07_OUTPUT/generated_story.png'
          )
          "

      - name: 6. Выгрузка готовой Сторис в Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-story-png
          path: 07_OUTPUT/generated_story.png
          retention-days: 7