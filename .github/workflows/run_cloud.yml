name: Run Cloud Video Indexer (Passport Generation)

on:
  workflow_dispatch:
  # schedule:
  #   - cron: '*/30 * * * *'

jobs:
  run-indexer:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install System Dependencies for OpenCV & MoviePy
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsm6 libxext6 libgl1-mesa-glx

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Restore service_account.json from Secret
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$SERVICE_ACCOUNT_JSON" > service_account.json

      - name: Run Cloud Indexer
        env:
          VERCEL_PROXY_URL: "https://video-ai-engine.vercel.app/api/gemini"
        run: |
          python run_cloud.py

      - name: Commit & Push updated Passports to Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add 04_LIBRARY/passports/
          git commit -m "auto: update video passports from run_cloud" || echo "No changes to commit"
          git push