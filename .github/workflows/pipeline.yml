name: Production Video Pipeline

on:
  workflow_dispatch:
    inputs:
      prompt_text:
        description: 'ТЗ / Промпт для сборки ролика'
        required: true
        default: 'Собери динамичный ролик из лучших моментов'
        type: string

# Выдаем права на запись для успешного git push из GitHub Actions
permissions:
  contents: write

jobs:
  build-and-render:
    runs-on: ubuntu-latest
    # Общий таймаут на весь workflow (90 минут — максимальный лимит GitHub для public/free)
    timeout-minutes: 90

    steps:
      - name: 1. Чтение кода из Git
        uses: actions/checkout@v4

      - name: 1.1. Оптимизация диска и увеличение Swap (Защита от OOM при рендеринге обложки)
        run: |
          sudo swapoff -a
          sudo rm -f /swapfile
          sudo fallocate -l 4G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          echo "=== SWAP CONFIGURED ==="
          free -h

      - name: 2. Установка Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Установка системных зависимостей (FFmpeg + OpenGL/EGL/GLES)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libgl1 libegl1 libgles2 libglib2.0-0

      - name: 3.1. Запуск детального мониторинга оперативной памяти
        run: |
          while true; do
            echo "=== MEMORY & TOP PROCESSES ==="
            free -h
            ps aux --sort=-%mem | head -n 6
            sleep 10
          done &

      - name: 4. Воссоздание service_account.json из Secrets
        env:
          SERVICE_ACCOUNT_DATA: ${{ secrets.SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$SERVICE_ACCOUNT_DATA" > service_account.json

      - name: 5. Установка зависимостей Python
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir -r requirements.txt

      - name: 5.1. Установка Chromium и системных библиотек для Playwright
        run: |
          python -m playwright install chromium --with-deps

      - name: 6. Запуск пайплайна сборки видео
        # Выставляем явный таймаут 60 минут конкретно на сборку
        timeout-minutes: 60
        env:
          VERCEL_PROXY_URL: ${{ secrets.VERCEL_PROXY_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONUNBUFFERED: "1"
          PYTHONPATH: "."
          # Флаги для предотвращения крашей Playwright / Chromium при генерации горизонтальной обложки
          PLAYWRIGHT_CHROMIUM_ARGS: "--no-sandbox --disable-dev-shm-usage --disable-gpu"
        run: |
          python -m src.core.production_pipeline "${{ inputs.prompt_text }}"

      - name: 7. Выгрузка готового ролика в Artifacts GitHub
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-video-output
          path: |
            07_OUTPUT/
          retention-days: 7

      - name: 8. Сохранение и коммит файла истории в Git
        if: always()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          if [ -f "04_LIBRARY/history.json" ]; then
            git add 04_LIBRARY/history.json
            git commit -m "chore: update video history log [skip ci]" || echo "Нет изменений для коммита"
            git push
          else
            echo "Файл истории не найден, пропускаем коммит."
          fi